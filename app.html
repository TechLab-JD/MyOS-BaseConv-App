<div class="app-window" id="BaseConvApp">
  <div class="app-header"><span class="app-title">🔢 Base Converter</span><div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div></div>
  <div class="app-content">
    <div class="bc">
      <label class="bc-f"><span>Binary</span><input id="bc-2" spellcheck="false" placeholder="0"></label>
      <label class="bc-f"><span>Octal</span><input id="bc-8" spellcheck="false" placeholder="0"></label>
      <label class="bc-f"><span>Decimal</span><input id="bc-10" spellcheck="false" placeholder="0"></label>
      <label class="bc-f"><span>Hex</span><input id="bc-16" spellcheck="false" placeholder="0"></label>
      <div id="bc-err" class="bc-err"></div>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
